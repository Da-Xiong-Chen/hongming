<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" role="img" aria-label="電木壓縮成型模具結構剖面示意圖">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0v30" fill="none" stroke="#59b6f0" stroke-width=".5" opacity=".14"/>
    </pattern>
    <pattern id="heat" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#ff9147" stroke-width="1.7" opacity=".5"/>
    </pattern>
    <linearGradient id="steelFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3d52"/>
      <stop offset="1" stop-color="#1b2838"/>
    </linearGradient>
    <linearGradient id="platen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22303f"/>
      <stop offset="1" stop-color="#16212d"/>
    </linearGradient>
    <linearGradient id="charge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb072"/>
      <stop offset="1" stop-color="#d9702a"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="#0c1522"/>
  <rect width="600" height="450" fill="url(#grid)"/>

  <!-- frame + registration marks -->
  <rect x="16" y="16" width="568" height="418" fill="none" stroke="#59b6f0" stroke-width="1" opacity=".28"/>
  <g stroke="#59b6f0" stroke-width="1.4" opacity=".55">
    <path d="M16 40V16h24M560 16h24v24M584 410v24h-24M40 434H16v-24"/>
  </g>

  <!-- title block -->
  <text x="34" y="46" fill="#e9edf3" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="15" font-weight="600">電木壓縮成型模具</text>
  <text x="34" y="62" fill="#7fc3ec" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" letter-spacing="2.2">COMPRESSION MOLD · CROSS SECTION</text>
  <text x="566" y="46" text-anchor="end" fill="#59b6f0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" letter-spacing="2">HG MOLD MAKER</text>

  <!-- ===== upper assembly ===== -->
  <rect x="120" y="100" width="320" height="28" rx="2" fill="url(#platen)" stroke="#59b6f0" stroke-width="1.2" opacity=".95"/>
  <rect x="130" y="132" width="300" height="26" rx="2" fill="url(#heat)" stroke="#ff9147" stroke-width="1.2" opacity=".9"/>
  <path d="M150 162h260v53H328v23h-96v-23h-82z" fill="url(#steelFace)" stroke="#8fd2f7" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- ===== parting line ===== -->
  <line x1="96" y1="239" x2="470" y2="239" stroke="#ff9147" stroke-width="1.2" stroke-dasharray="10 6" opacity=".85"/>

  <!-- ===== lower assembly ===== -->
  <path d="M150 300v-58h76v30h108v-30h76v58z" fill="url(#steelFace)" stroke="#8fd2f7" stroke-width="1.6" stroke-linejoin="round"/>
  <rect x="232" y="244" width="96" height="26" rx="1.5" fill="url(#charge)" stroke="#ffd0a8" stroke-width="1"/>
  <rect x="130" y="304" width="300" height="26" rx="2" fill="url(#heat)" stroke="#ff9147" stroke-width="1.2" opacity=".9"/>
  <rect x="120" y="334" width="320" height="28" rx="2" fill="url(#platen)" stroke="#59b6f0" stroke-width="1.2" opacity=".95"/>

  <!-- guide pins -->
  <g fill="#0c1522" stroke="#8fd2f7" stroke-width="1.3" opacity=".9">
    <rect x="161" y="166" width="10" height="130" rx="5"/>
    <rect x="389" y="166" width="10" height="130" rx="5"/>
  </g>

  <!-- ejector pins -->
  <g stroke="#8fd2f7" stroke-width="4" stroke-linecap="round" opacity=".8">
    <line x1="252" y1="358" x2="252" y2="272"/>
    <line x1="308" y1="358" x2="308" y2="272"/>
  </g>

  <!-- press force arrows -->
  <g stroke="#ff9147" stroke-width="2" stroke-linecap="round" fill="none" opacity=".9">
    <path d="M200 70v20M194 84l6 7 6-7"/>
    <path d="M360 70v20M354 84l6 7 6-7"/>
  </g>
  <text x="280" y="80" text-anchor="middle" fill="#ffb072" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" letter-spacing="1.5">加壓 · 加熱</text>

  <!-- ===== callouts ===== -->
  <g stroke="#8fd2f7" stroke-width="1" opacity=".75">
    <path d="M440 114h34"/>
    <path d="M430 145h44"/>
    <path d="M410 190h64"/>
    <path d="M470 239h4"/>
    <path d="M410 282h64"/>
  </g>
  <g fill="#e9edf3" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5">
    <text x="480" y="118">上模板</text>
    <text x="480" y="149">加熱板</text>
    <text x="480" y="194">上模仁</text>
    <text x="480" y="243">分模線</text>
    <text x="480" y="286">下模仁</text>
  </g>
  <g fill="#7f93a8" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="7.5" letter-spacing="1">
    <text x="480" y="128">TOP PLATE</text>
    <text x="480" y="159">HEATER</text>
    <text x="480" y="204">PUNCH</text>
    <text x="480" y="253">PARTING LINE</text>
    <text x="480" y="296">CAVITY</text>
  </g>

  <!-- mold height dimension -->
  <g stroke="#59b6f0" stroke-width="1" opacity=".6" fill="none">
    <path d="M96 100h18M96 362h18M100 100v262"/>
    <path d="M96 106l4-6 4 6M96 356l4 6 4-6" stroke-linejoin="round"/>
  </g>
  <text x="90" y="235" text-anchor="end" fill="#7fc3ec" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" letter-spacing="1" transform="rotate(-90 90 235)">MOLD HEIGHT</text>

  <!-- legend -->
  <rect x="34" y="392" width="16" height="12" rx="1.5" fill="url(#charge)" stroke="#ffd0a8" stroke-width="1"/>
  <text x="58" y="402" fill="#c9d4e0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11">電木料 Bakelite charge</text>
  <text x="566" y="402" text-anchor="end" fill="#5f7183" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="8.5" letter-spacing="1.4">SCHEMATIC · NOT TO SCALE</text>
</svg>
